name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.13"]
        include:
          # 3.9 is the stated minimum. The newest Ubuntu image no longer offers it, so it runs on macOS.
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity (some tests make commits)
        run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
      - name: Test suite
        run: python -W ignore::ResourceWarning -m unittest discover -s tests
      - name: Verifier library lint
        run: bin/sisi verifiers lint
